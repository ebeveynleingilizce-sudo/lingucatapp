<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinguCat bağlantı onarımı</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#10172f;color:#f5f7ff;font:16px/1.6 Arial}main{max-width:440px;padding:24px;text-align:center}a{color:#20c9ef}</style><main><h1>LinguCat</h1><p id="status" role="status">Eski bağlantı kaydı yenileniyor. Öğrenme ilerlemen korunuyor.</p><a href="./index.html">LinguCat’i aç</a></main><script>
(async function(){try{if('serviceWorker'in navigator){var scope=new URL('./',location.href).href;var registrations=await navigator.serviceWorker.getRegistrations();for(var registration of registrations){if(registration.scope===scope)await registration.unregister();}}location.replace('./index.html?connection-repaired=1');}catch(e){document.getElementById('status').textContent='Otomatik onarım tamamlanamadı. Bu sekmeyi kapatıp LinguCat’i yeniden açabilirsin.';}})();
</script></html>
